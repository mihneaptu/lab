<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown · mihneaptu/lab</title>

  <!-- What this page is, for search results and for the card that gets
       drawn when someone drops the link in a chat. Without these a link
       to a page whose whole point is how it MOVES arrives as bare text. -->
  <meta name="description" content="A countdown whose digits lift away in sequence when it lands, handing the page over to what it was counting to, and a burst of confetti behind it.">
  <link rel="canonical" href="https://mihneaptu.github.io/lab/animations/countdown/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="mihneaptu/lab">
  <meta property="og:title" content="Countdown">
  <meta property="og:description" content="A countdown whose digits lift away in sequence when it lands, handing the page over to what it was counting to, and a burst of confetti behind it.">
  <meta property="og:url" content="https://mihneaptu.github.io/lab/animations/countdown/">
  <meta property="og:image" content="https://mihneaptu.github.io/lab/og.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Paints the browser's own chrome to match the page it frames.
       Both values are --paper from tokens.css, one per sky. -->
  <meta name="theme-color" content="#f4f4f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">

  <!-- Mono is what the clock is set in, and the clock is what paints
       first, so mono is what gets preloaded. The message is in the body
       face — but it's hidden until the handoff lands, so preloading
       Instrument Sans here would fetch 30 KB that nothing on the first
       screen renders in. It has the whole countdown to arrive. -->
  <link rel="preload" href="../../fonts/spline-sans-mono.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../styles/fonts.css">

  <!-- Sets the theme BEFORE the page paints, so there's no flash of the
       wrong colors. Your last choice wins; otherwise the OS preference. -->
  <script>
    /* Storage access can throw outright, not just come back empty: a
       locked-down profile or a blocked third-party context refuses the
       read. An uncaught throw here would abort this script and leave the
       page dressed in the wrong sky before it ever paints, so the OS
       preference stands in. Scoped in an IIFE to keep the head clean. */
    (() => {
      let saved = null;
      try { saved = localStorage.getItem("theme"); } catch {}
      document.documentElement.dataset.theme =
        saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    })();
  </script>

  <link rel="stylesheet" href="../../styles/tokens.css">
  <link rel="stylesheet" href="../../styles/base.css">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <a class="back-link" href="../../index.html">&larr; back</a>
  <!-- A standalone, dependency-free version of this exhibit lives in
       code.html; copy-code.js turns this link into a clipboard button. -->
  <a class="copy-code" href="code.html">copy code</a>

  <!-- The theme switch, the sun-moon exhibit's morph in miniature and
       icon-only: the icon IS the current sky. CSS keys the poses off
       <html data-theme>, so flipping the theme plays the animation. -->
  <button class="theme-toggle theme-toggle--corner" type="button" aria-label="Switch color theme">
    <svg class="tt-sky" viewBox="0 0 24 24" aria-hidden="true">
      <mask id="tt-crescent">
        <rect x="0" y="0" width="24" height="24" fill="white" />
        <circle class="tt-bite" cx="33" cy="10.5" r="9" fill="black" />
      </mask>
      <g mask="url(#tt-crescent)">
        <g class="tt-rays" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="12" y1="1"     x2="12"    y2="3" />
          <line x1="12" y1="21"    x2="12"    y2="23" />
          <line x1="1"  y1="12"    x2="3"     y2="12" />
          <line x1="21" y1="12"    x2="23"    y2="12" />
          <line x1="4.22"  y1="4.22"  x2="5.64"  y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="4.22"  y1="19.78" x2="5.64"  y2="18.36" />
          <line x1="18.36" y1="5.64"  x2="19.78" y2="4.22" />
        </g>
        <circle class="tt-disc" cx="12" cy="12" r="6" fill="currentColor" />
      </g>
    </svg>
  </button>

  <!-- The confetti's canvas. Fixed over the whole viewport and outside
       <main>, because the burst is thrown from the screen's edges, not
       from the exhibit's box — cannons firing from off-screen left and
       right need the paper's full width to cross. pointer-events: none
       in the stylesheet keeps it from swallowing clicks on the way. -->
  <canvas class="cd-fx" aria-hidden="true"></canvas>

  <main class="cd-stage">
    <!-- The exhibit needs no visible title, but its outline does: a page
         with no h1 gives anyone navigating by headings nothing to land on. -->
    <h1 class="visually-hidden">Countdown</h1>

    <!-- The two faces of this page — the count, and what it was counting
         to — stacked in ONE grid cell rather than swapped with display.

         Two things fall out of that. The cell sizes itself to the taller
         of the two, and the resting one is hidden with visibility (which
         still reserves its space) rather than display (which doesn't) —
         so the handoff never resizes the page and the replay button
         underneath never moves, with no hardcoded height anywhere to
         keep in step with the type. And a visibility/opacity swap can be
         animated, where a display swap can only ever snap. -->
    <div class="cd-slot">
      <!-- The countdown's whole face: the frame and the date it names.
           Grouped because the handoff fades them together as one object
           after the digits have left — the date belongs to the count, so
           it goes when the count does. -->
      <div class="cd-face">
        <!-- One grid, four cells, hairline gaps showing the frame's color
             through — so the "borders" between units are the container
             itself, and there are no double lines to reconcile at the
             corners.

             Each cell's contents are wrapped in a .cd-stack because the
             handoff lifts the DIGITS while the frame around them stays
             put and fades on its own clock. Two things on two timelines
             need two elements; animating the cell would drag its
             background along with them.

             aria-hidden, with the live region below carrying the real
             reading: a screen reader announcing four separately-updating
             numbers once a second is unusable, and "07" on its own means
             nothing anyway. -->
        <div class="cd-clock" aria-hidden="true">
          <div class="cd-unit"><div class="cd-stack"><div class="cd-num" data-unit="d">--</div><div class="cd-name">Days</div></div></div>
          <div class="cd-unit"><div class="cd-stack"><div class="cd-num" data-unit="h">--</div><div class="cd-name">Hours</div></div></div>
          <div class="cd-unit"><div class="cd-stack"><div class="cd-num" data-unit="m">--</div><div class="cd-name">Minutes</div></div></div>
          <div class="cd-unit"><div class="cd-stack"><div class="cd-num" data-unit="s">--</div><div class="cd-name">Seconds</div></div></div>
        </div>

        <p class="cd-date"></p>
      </div>

      <!-- Filled by script.js from the MESSAGE constant, so the exhibit's
           two configurable facts (what it counts to, what it says on
           arrival) sit together at the top of one file. -->
      <p class="cd-message"></p>
    </div>

    <!-- The countdown, in words, for anyone not reading the grid. Polite
         and coarse on purpose: it's refreshed about once a minute, not
         once a second, so it reports where the count is without talking
         over everything else a visitor is doing. -->
    <p class="cd-reading visually-hidden" role="status"></p>

    <!-- The exhibit's payoff fires once a year, which is no way to show
         an animation. This runs it on demand. Its label says which of
         the two things it will do, so the button is never a mystery box:
         "replay the handoff" from the countdown, "back to the countdown"
         once the message is up. script.js owns the wording. -->
    <button class="cd-replay" type="button"></button>
  </main>

  <script src="script.js"></script>
  <script src="../../scripts/theme.js"></script>
  <script src="../../scripts/haptics.js"></script>
  <script src="../../scripts/copy-code.js"></script>

</body>
</html>
